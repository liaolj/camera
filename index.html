<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Photobooth</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f8fa;
      --card-bg: rgba(255, 255, 255, 0.85);
      --accent: #007bff;
      --accent-dark: #0056b3;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #88b2ff 0%, #f7f9ff 40%, var(--bg) 100%);
    }

    main {
      width: min(960px, 95vw);
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      padding: 2.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3rem);
      color: #0f172a;
    }

    p.description {
      margin: 0.5rem auto 0;
      color: #475569;
      max-width: 520px;
      line-height: 1.6;
    }

    .booth {
      display: grid;
      gap: 1.5rem;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }

    .preview,
    .snapshot {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.05);
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video,
    canvas {
      width: 100%;
      height: auto;
      display: block;
      border-radius: inherit;
      background: #0f172a;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin: 1.5rem 0 0;
    }

    button,
    a.download {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 0.85rem 1.8rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      background: var(--accent);
      color: white;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 12px 30px rgba(0, 123, 255, 0.3);
    }

    button:hover,
    a.download:hover,
    button:focus-visible,
    a.download:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 18px 40px rgba(0, 123, 255, 0.35);
      background: var(--accent-dark);
      outline: none;
    }

    button.secondary {
      background: rgba(15, 23, 42, 0.1);
      color: #0f172a;
      box-shadow: none;
    }

    button.secondary:hover,
    button.secondary:focus-visible {
      background: rgba(15, 23, 42, 0.18);
    }

    .thumbnails {
      margin-top: 2rem;
    }

    .thumbnails h2 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      color: #0f172a;
    }

    .thumb-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 1rem;
    }

    .thumb {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.15);
    }

    .thumb img {
      display: block;
      width: 100%;
      height: auto;
    }

    .empty {
      text-align: center;
      color: #64748b;
      font-style: italic;
    }

    .error {
      margin-top: 1rem;
      color: #ef4444;
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>FlashFrame Photobooth</h1>
      <p class="description">
        Allow camera access to preview yourself live, snap crisp photos, and collect them in a gallery you can download.
        Everything runs in your browser&mdash;no uploads required.
      </p>
    </header>

    <section class="booth">
      <div class="preview">
        <video id="live" playsinline autoplay muted></video>
      </div>
      <div class="snapshot">
        <canvas id="frame" width="1280" height="720" aria-label="Latest captured photo"></canvas>
      </div>
    </section>

    <div class="controls">
      <button id="capture" type="button">📸 Capture</button>
      <button id="clear" type="button" class="secondary">🗑️ Clear Gallery</button>
      <a id="download" class="download" href="#" download="photobooth-shot.png" hidden>💾 Download Last Photo</a>
    </div>

    <p id="error" class="error" role="alert" hidden></p>

    <section class="thumbnails">
      <h2>Your Shots</h2>
      <div id="gallery" class="thumb-grid" role="list">
        <p class="empty" id="empty-state">No photos yet&mdash;strike a pose!</p>
      </div>
    </section>
  </main>

  <script>
    const video = document.getElementById('live');
    const canvas = document.getElementById('frame');
    const ctx = canvas.getContext('2d');
    const captureBtn = document.getElementById('capture');
    const clearBtn = document.getElementById('clear');
    const downloadLink = document.getElementById('download');
    const gallery = document.getElementById('gallery');
    const emptyState = document.getElementById('empty-state');
    const errorEl = document.getElementById('error');

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
        video.srcObject = stream;
        errorEl.hidden = true;
        return stream;
      } catch (err) {
        errorEl.textContent = 'Unable to access camera: ' + err.message;
        errorEl.hidden = false;
        captureBtn.disabled = true;
        clearBtn.disabled = true;
        return null;
      }
    }

    function drawFrame() {
      const { videoWidth, videoHeight } = video;
      if (!videoWidth || !videoHeight) {
        return;
      }
      canvas.width = videoWidth;
      canvas.height = videoHeight;
      ctx.drawImage(video, 0, 0, videoWidth, videoHeight);
    }

    function addToGallery(dataUrl) {
      const item = document.createElement('figure');
      item.className = 'thumb';
      item.setAttribute('role', 'listitem');

      const image = document.createElement('img');
      image.src = dataUrl;
      image.alt = 'Captured photobooth moment';

      const caption = document.createElement('figcaption');
      caption.textContent = new Date().toLocaleTimeString();
      caption.style = 'position:absolute;bottom:0;left:0;right:0;padding:0.35rem 0.5rem;font-size:0.75rem;color:white;background:linear-gradient(0deg, rgba(15,23,42,0.65) 0%, rgba(15,23,42,0) 80%);';

      item.appendChild(image);
      item.appendChild(caption);
      gallery.prepend(item);

      emptyState.hidden = true;
    }

    captureBtn.addEventListener('click', () => {
      drawFrame();
      const data = canvas.toDataURL('image/png');
      addToGallery(data);
      downloadLink.href = data;
      downloadLink.hidden = false;
    });

    clearBtn.addEventListener('click', () => {
      gallery.innerHTML = '';
      emptyState.hidden = false;
      gallery.appendChild(emptyState);
      downloadLink.hidden = true;
    });

    video.addEventListener('loadedmetadata', () => {
      if (video.videoWidth && video.videoHeight) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      }
    });

    window.addEventListener('beforeunload', () => {
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }
    });

    initCamera();
  </script>
</body>
</html>
